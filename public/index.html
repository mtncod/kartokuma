<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kartokuma — Kartvizit Okuma</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kartokuma" />
</head>
<body>
  <main>
    <h1>Kartokuma</h1>
    <p>Bir kartvizit fotoğrafı yükle, bilgileri otomatik çıkaralım.</p>

    <label class="upload-box" for="fileInput">
      <span id="uploadLabel">Fotoğraf seç veya çek</span>
      <input type="file" id="fileInput" accept="image/*" capture="environment" />
    </label>

    <div id="status" class="status" hidden></div>

    <section id="result" class="result" hidden>
      <h2>Sonuç</h2>
      <pre id="reportText"></pre>
      <p id="formHint" class="form-hint" hidden></p>
      <div class="actions">
        <button id="copyBtn" type="button">Panoya Kopyala</button>
        <button id="csvBtn" type="button">Excel İndir</button>
        <button id="xmlBtn" type="button">XML İndir</button>
      </div>
    </section>

    <div id="error" class="error" hidden></div>

    <hr class="section-divider" />

    <h2>Form Tara</h2>
    <p>Elle veya bilgisayarda doldurulmuş bir form fotoğrafı yükle, metne çevirelim.</p>

    <label class="upload-box" for="formFileInput">
      <span>Form fotoğrafı seç veya çek</span>
      <input type="file" id="formFileInput" accept="image/*" capture="environment" />
    </label>

    <div id="formStatus" class="status" hidden></div>

    <section id="formResult" class="result" hidden>
      <h2>Form Metni</h2>
      <pre id="formReportText"></pre>
    </section>

    <div id="formError" class="error" hidden></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
